[book]
title = "seastamp"
description = "Stamp longitude/latitude points with sea attributes: distance to coast, bathymetric depth, sea name, nearest country and municipality, and the nearest location in a table you supply."
authors = ["AIQC-Hub"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/AIQC-Hub/seastamp"
edit-url-template = "https://github.com/AIQC-Hub/seastamp/edit/main/docs/{path}"
site-url = "/seastamp/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
